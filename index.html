<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YB Maps">
<title>YB Maps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="bar" class="bar">
  <div class="row">
    <span class="pin from"></span>
    <input id="from" type="text" value="My location" placeholder="From" autocomplete="off" enterkeyhint="search">
    <button id="here" type="button" class="icon-btn" aria-label="Use my location">📍</button>
    <button id="cog" type="button" class="icon-btn" aria-label="Search settings">⚙️</button>
  </div>
  <div id="stops"></div>
  <div class="row">
    <span class="pin to"></span>
    <input id="to" type="text" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
    <button id="add-stop" type="button" class="icon-btn" aria-label="Add a stop">➕</button>
    <button id="go" type="button">Go</button>
  </div>
  <div id="results" class="results"></div>
  <div id="nav" class="nav hidden">
    <span id="nav-icon" class="nav-icon">↑</span>
    <span class="nav-body">
      <span id="nav-dist" class="nav-dist"></span>
      <span id="nav-text" class="nav-text"></span>
    </span>
  </div>
  <div id="nav-then" class="nav-then hidden"></div>
  <div id="trip" class="trip hidden">
    <span id="trip-text"></span>
    <span class="trip-btns">
      <button id="edit-trip" type="button" aria-label="Change From, To or stops">✎</button>
      <button id="save-place" type="button" aria-label="Save this place">⭐</button>
      <button id="mute" type="button" aria-label="Voice on or off">🔊</button>
      <button id="clear" type="button" aria-label="Clear route">✕</button>
    </span>
  </div>
</div>

<button id="recenter" class="traffic-btn recenter-btn hidden" type="button" aria-label="Recentre on me">🎯</button>
  <button id="compass" class="traffic-btn compass-btn hidden" type="button" aria-label="Map direction: heading up or north up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l5 10H7z" fill="#ef4444"/><path d="M12 22l-5-10h10z" fill="#e2e8f0"/></svg></button>
  <button id="traffic" class="traffic-btn hidden" type="button" aria-label="Live traffic on or off">🚦</button>
  <div id="attrib" class="attrib hidden">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></div>
  <div id="status" class="status">Waiting for GPS…</div>

<div id="card" class="card">
  <div class="speed">
    <span id="speed" class="speed-val">--</span>
    <span class="speed-unit">km/h</span>
  </div>
  <div id="limit" class="limit-sign" title="Speed limit">
    <span id="limit-val">?</span>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
