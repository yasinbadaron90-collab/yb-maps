<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map style preview</title><link rel="stylesheet" href="vendor/leaflet.css">
<style>html,body{margin:0;height:100%;font:14px sans-serif}#m{position:absolute;inset:0}
.b{position:absolute;z-index:1000;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.b button{padding:12px 18px;font-size:16px;border:0;border-radius:10px;background:#0f172a;color:#fff}.b button.on{background:#2563eb}</style></head>
<body><div id="m"></div><div class="b"><button id="a" class="on">Now (OSM)</button><button id="v">TomTom</button></div>
<script src="vendor/leaflet.js"></script><script>
var map=L.map('m').setView([-34.8,20.05],15);
var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
var k='';try{k=localStorage.getItem('yb-maps-tomtom-key')||''}catch(e){}
var vg=L.tileLayer('https://api.tomtom.com/map/1/tile/basic/main/{z}/{x}/{y}.png?key='+encodeURIComponent(k)+'&tileSize=256',{maxZoom:22,attribution:'© TomTom'});
if(!k)document.title='No TomTom key saved in this browser';
osm.addTo(map);
function pick(w){map.removeLayer(w?vg:osm);(w?osm:vg).remove();(w?vg:osm).addTo(map);a.className=w?'':'on';v.className=w?'on':''}
a.onclick=function(){pick(0)};v.onclick=function(){pick(1)};
</script></body></html>
